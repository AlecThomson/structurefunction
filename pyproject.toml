[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling>=1.26" ]

[project]
name = "structurefunction"
description = """\
  Fast, robust structure functions of irregularly sampled sky data, with multi-point stencils and covariance errors.\
  """
readme = "README.md"
keywords = [ "astronomy", "faraday rotation", "rotation measure", "structure function", "turbulence" ]
license = "MIT"
license-files = [ "LICENSE" ]
authors = [ { name = "Alec Thomson" } ]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Typing :: Typed",
]
dynamic = [ "version" ]
dependencies = [
  "astropy>=6",
  "astropy-healpix>=1.1",
  "capn-crunch>=1.2",
  "emcee>=3.1",
  "numba>=0.61",
  "numpy>=1.26",
  "pydantic>=2.10",
  "scipy>=1.12",
]
optional-dependencies.evidence = [ "nautilus-sampler>=1.0.4" ]
optional-dependencies.plot = [ "corner>=2.2", "matplotlib>=3.8" ]
urls."Bug Tracker" = "https://github.com/AlecThomson/structurefunction/issues"
urls.Changelog = "https://github.com/AlecThomson/structurefunction/releases"
urls.Documentation = "https://structurefunction.readthedocs.io/"
urls.Homepage = "https://github.com/AlecThomson/structurefunction"
scripts.structurefunction = "structurefunction.cli:cli"

[dependency-groups]
dev = [
  { include-group = "test" },
  "mypy>=2",
  "nautilus-sampler>=1.0.6",
  "prek>=0.5",
  "ruff>=0.17",
  "scipy-stubs>=1.16",
  # ty is beta: pin exactly; bump deliberately (see CLAUDE.md).
  "ty==0.0.107",
]
test = [
  "matplotlib>=3.8",
  "nbconvert>=7",
  "nbformat>=5.10",
  "pytest>=9",
  "pytest-cov>=7",
  "pytest-xdist>=3.6",
  # TreeCorr is an independent 2-point reference in the tests only (no Windows wheels).
  "treecorr>=5.1; sys_platform!='win32'",
]
docs = [
  "furo>=2024.8.6",
  "ipykernel>=6",
  "matplotlib>=3.8",
  "myst-parser>=4",
  "nbsphinx>=0.9.6",
  "sphinx>=7",
  "sphinx-argparse>=0.5",
  "sphinx-autoapi>=3.3",
  "sphinx-autodoc-typehints>=2",
  "sphinx-copybutton>=0.5",
]

[tool.hatch]
version.source = "vcs"
build.hooks.vcs.version-file = "structurefunction/_version.py"

[tool.ruff]
line-length = 88
src = [ "structurefunction", "tests" ]
lint.select = [ "ALL" ]
lint.ignore = [
  # Noise
  "A005",    # module names like types.py/logging.py are fine with absolute imports
  "C901",    # complexity counts: numba kernels are deliberately flat
  # Conflicts (with each other or with the formatter)
  "COM812",
  "CPY001",  # licence lives in LICENSE/pyproject, not per-file headers
  "D203",
  "D213",
  "EM101",   # allow raise ValueError("literal")
  "EM102",   # allow raise ValueError(f"...")
  "FBT001",  # boolean positional parameters
  "FBT002",  # boolean default parameters
  "FBT003",  # boolean positional arguments (numba calls)
  "ISC001",
  "PLC0415", # lazy imports of optional dependencies are intentional
  "PLR0911", # too many returns
  "PLR0912", # too many branches
  "PLR0913", # too many arguments: scientific APIs take many options
  "PLR0915", # too many statements
  "PLR0917", # too many positional args: house style avoids keyword-only `*`
  "PLR2004", # magic values: physical constants and thresholds read better inline
  "TC001",   # TYPE_CHECKING import shuffling is churn with postponed annotations
  "TC002",
  "TC003",
  "TRY003",  # long messages in exception constructors are fine
]
lint.per-file-ignores."benchmarks/**" = [
  "INP001", # scripts, not a package
  "T201",   # benchmarks print their results
]
lint.per-file-ignores."docs/**" = [ "INP001" ]
lint.per-file-ignores."docs/examples/*.ipynb" = [
  "D100", # notebooks have no module docstring
  "E402", # imports live in the cell where they are first needed
  "S101", # self-checking examples assert their results
  "T201", # examples print results
]
lint.per-file-ignores."tests/**" = [
  "D",      # test names are the documentation
  "INP001", # tests are not a package
  "S101",   # pytest uses assert
]
lint.isort.known-first-party = [ "structurefunction" ]
lint.isort.known-local-folder = [ "conftest", "reference" ]
lint.isort.required-imports = [ "from __future__ import annotations" ]
lint.pydocstyle.convention = "google"

[tool.repo-review]
ignore = [
  "PC140", # mypy and ty run as local hooks so they see the project's real deps
  "PC170", # no reStructuredText in the repository
]

[tool.typos]
default.extend-identifiers = { NDArray = "NDArray" }
default.extend-words = { arange = "arange" }

[tool.mypy]
files = [ "structurefunction", "tests" ]
python_version = "3.12"
warn_unreachable = true
enable_error_code = [ "ignore-without-code", "redundant-expr", "truthy-bool" ]
strict = true

[[tool.mypy.overrides]]
# These ship no type information. astropy in particular is untyped (no
# py.typed); it is confined to structurefunction/units.py and the public
# signatures, where it degrades to Any.
module = [
  "astropy.*",
  "astropy_healpix.*",
  "corner.*",
  "emcee.*",
  "nautilus.*",
  "nbconvert.*",
  "nbformat.*",
  "numba.*",
  "treecorr.*",
]
ignore_missing_imports = true
follow_untyped_imports = false

[[tool.mypy.overrides]]
# nbconvert/nbformat are untyped; only the notebook runner calls them.
module = [ "test_examples" ]
disallow_untyped_calls = false

[tool.ty]
src.include = [ "structurefunction", "tests" ]
environment.python-version = "3.12"

[tool.pytest]
addopts = [ "-ra", "--showlocals" ]
filterwarnings = [
  "error",
  # Small test catalogues trip the resampling guard rails; tests opt back in.
  "ignore::structurefunction.StructureFunctionWarning",
]
log_level = "INFO"
markers = [
  "slow: statistical calibration tests (many mocks)",
  "slow_uncompiled: too slow to run with NUMBA_DISABLE_JIT=1",
]
minversion = "9.0"
strict = true
testpaths = [ "tests" ]

[tool.coverage]
run.source = [ "structurefunction" ]
report.exclude_also = [ '\.\.\.', "if TYPE_CHECKING:" ]
