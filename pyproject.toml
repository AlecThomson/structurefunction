[build-system]
build-backend = "hatchling.build"
requires = [ "hatch-vcs", "hatchling>=1.26" ]

[project]
name = "structurefunction"
description = "Fast, robust structure functions of irregularly sampled sky data, with multi-point stencils and covariance errors."
readme = "README.md"
keywords = [ "astronomy", "faraday rotation", "rotation measure", "structure function", "turbulence" ]
license = "MIT"
license-files = [ "LICENSE" ]
authors = [ { name = "Alec Thomson" } ]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Typing :: Typed",
]
dynamic = [ "version" ]
dependencies = [
  "astropy>=6",
  "emcee>=3.1",
  "numba>=0.61",
  "numpy>=1.26",
  "scipy>=1.12",
]
optional-dependencies.evidence = [ "nautilus-sampler>=1.0.4" ]
optional-dependencies.plot = [ "corner>=2.2", "matplotlib>=3.8" ]
urls."Bug Tracker" = "https://github.com/AlecThomson/structurefunction/issues"
urls.Changelog = "https://github.com/AlecThomson/structurefunction/releases"
urls.Documentation = "https://structurefunction.readthedocs.io/"
urls.Homepage = "https://github.com/AlecThomson/structurefunction"
scripts.structurefunction = "structurefunction.cli:cli"

[dependency-groups]
test = [
  "matplotlib>=3.8",
  "nbconvert>=7",
  "nbformat>=5.10",
  "pytest>=9",
  "pytest-cov>=7",
  "pytest-xdist>=3.6",
  # TreeCorr is an independent 2-point reference in the tests only (no Windows wheels).
  "treecorr>=5.1; sys_platform!='win32'",
]
dev = [
  { include-group = "test" },
  "mypy>=2",
  "prek>=0.5",
  "ruff>=0.17",
  "scipy-stubs>=1.16",
  # ty is beta: pin exactly; bump deliberately (see CLAUDE.md).
  "ty==0.0.107",
]
docs = [
  "furo>=2024.8.6",
  "matplotlib>=3.8",
  "ipykernel>=6",
  "myst-parser>=4",
  "nbsphinx>=0.9.6",
  "sphinx>=7",
  "sphinx-autoapi>=3.3",
  "sphinx-autodoc-typehints>=2",
  "sphinx-copybutton>=0.5",
]

[tool.hatch]
version.source = "vcs"
build.hooks.vcs.version-file = "structurefunction/_version.py"

[tool.ruff]
line-length = 88
src = [ "structurefunction", "tests" ]
lint.select = [ "ALL" ]
lint.ignore = [
  "COM812", # conflicts with the formatter
  "D203",   # conflicts with D211
  "D213",   # conflicts with D212
  "ISC001", # conflicts with the formatter
]
lint.per-file-ignores."benchmarks/**" = [
  "INP001", # scripts, not a package
  "T201",   # benchmarks print their results
]
lint.per-file-ignores."docs/**" = [ "INP001" ]
lint.per-file-ignores."docs/examples/*.ipynb" = [
  "D100",   # notebooks have no module docstring
  "E402",   # imports live in the cell where they are first needed
  "T201",   # examples print results
]
lint.per-file-ignores."tests/**" = [
  "D",       # test names are the documentation
  "INP001",  # tests are not a package
  "PLR2004", # magic numbers are expected values
  "S101",    # pytest uses assert
]
lint.isort.required-imports = [ "from __future__ import annotations" ]
lint.pydocstyle.convention = "google"

[tool.pytest]
minversion = "9.0"
addopts = [ "-ra", "--showlocals" ]
strict = true
filterwarnings = [ "error" ]
log_level = "INFO"
testpaths = [ "tests" ]
markers = [
  "slow: statistical calibration tests (many mocks)",
  "slow_uncompiled: too slow to run with NUMBA_DISABLE_JIT=1",
]

[tool.coverage]
run.source = [ "structurefunction" ]
report.exclude_also = [ '\.\.\.', 'if TYPE_CHECKING:' ]

[tool.mypy]
files = [ "structurefunction", "tests" ]
python_version = "3.12"
strict = true
warn_unreachable = true
enable_error_code = [ "ignore-without-code", "redundant-expr", "truthy-bool" ]

[[tool.mypy.overrides]]
# Neither ships type information.
module = [ "numba.*", "emcee.*", "nautilus.*", "corner.*", "treecorr.*" ]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests use pytest fixtures and loose call patterns.
module = [ "tests.*" ]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = [ "structurefunction", "tests" ]

[tool.typos]
default.extend-words = { arange = "arange" }
